<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#0e1929"/>
  <!-- Central node -->
  <circle cx="16" cy="16" r="3.5" fill="none" stroke="#4da6ff" stroke-width="1.5"/>
  <!-- Orbit ring -->
  <circle cx="16" cy="16" r="7.5" fill="none" stroke="#4da6ff" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.6"/>
  <!-- Worker nodes at 3 positions -->
  <circle cx="16" cy="8" r="2" fill="#4da6ff"/>
  <circle cx="22.9" cy="20" r="2" fill="#4dd9d4"/>
  <circle cx="9.1" cy="20" r="2" fill="#4ecb91"/>
  <!-- Connection lines -->
  <line x1="16" y1="12.5" x2="16" y2="10" stroke="#4da6ff" stroke-width="0.75" opacity="0.5"/>
  <line x1="18.5" y1="17.5" x2="21" y2="18.7" stroke="#4dd9d4" stroke-width="0.75" opacity="0.5"/>
  <line x1="13.5" y1="17.5" x2="11" y2="18.7" stroke="#4ecb91" stroke-width="0.75" opacity="0.5"/>
</svg>
